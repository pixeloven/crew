---
# Security floor for this supply-chain root. Crew's skills/agents load AS
# INSTRUCTIONS into every consumer's agents and it's a public, widely-consumed
# pi-package + Claude-plugin, so a leaked secret or a vulnerable dependency here
# fans out to every consumer — a secret scan is the single highest-value gate.
#
# github-hosted floor (no baked runner) sourced from public marketplace actions,
# adapted from the upstream hosted-CI security template:
#   gitleaks           secret scan (full history — needs fetch-depth: 0)
#   osv-scanner        dependency CVEs, ONLINE osv.dev DB (JS package.json)
#   dependency-review  PR-only dependency delta gate
#   semgrep            SAST — ships COMMENTED (needs a token or vendored ruleset)
#
# Additive: this does NOT touch the existing ci.yml (plugin + skill validation).
# Actions are referenced by MAJOR tag (`@vN`), so patch and minor fixes arrive
# without a PR. The accepted trade-off: an owner can move a major tag, so every
# job keeps the narrowest `permissions:` it needs. An action that publishes no
# major tag is pinned to its latest release and noted inline.
name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      # gitleaks scans the full history, so fetch-depth: 0 is REQUIRED.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks CLI, not gitleaks-action: the action is license-gated for
      # GitHub ORGANIZATIONS (fine on personal accounts — which is exactly what
      # changed when this repo moved to the pixeloven org). The CLI is free,
      # and it is the same engine harmony-ci's gate library runs. Pinned
      # release, checksum from the GitHub-generated digest, --redact so a hit
      # never prints the secret into CI logs.
      - name: Run gitleaks (pinned CLI)
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --redact --exit-code 1

  osv-scanner:
    name: osv-scanner (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ONLINE osv.dev DB (github-hosted has egress). Reads the repo's manifests
      # natively (package.json here). Scans recursively; a non-zero exit blocks
      # the job. To grandfather accepted residue, add a repo-root osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0  # publishes no major tag; latest release
        with:
          scan-args: |-
            --recursive
            ./

  dependency-review:
    name: dependency-review (PR only)
    # PR-only: inspects the PR's dependency delta; no meaning on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # ── SAST CAVEAT (semgrep on github-hosted) ────────────────────────────────
  # On the private runner fleet, semgrep uses a baked, tokenless baseline ruleset. That
  # ruleset is PRIVATE (baked into the runner image), and Semgrep's registry
  # rulesets (p/*, `auto`) are LOGIN-GATED → zero findings tokenless. So on
  # github-hosted, semgrep needs ONE of:
  #   (A) a SEMGREP_APP_TOKEN secret (Semgrep Cloud / registry rules), OR
  #   (B) a VENDORED ruleset committed to your repo (e.g. .semgrep/rules.yml).
  # The floor above (gitleaks + osv + dependency-review) works WITHOUT either.
  # Uncomment ONE variant once you've chosen an approach.
  #
  # semgrep:
  #   name: semgrep (SAST)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: astral-sh/setup-uv@v7
  #     # Variant A — registry rules via a token (requires SEMGREP_APP_TOKEN secret):
  #     # - run: uvx semgrep ci
  #     #   env:
  #     #     SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
  #     # Variant B — a ruleset you vendor into the repo (no token, no login):
  #     - run: uvx semgrep scan --config .semgrep/rules.yml --error --metrics=off

  # ── AGGREGATOR (a convenient single check) ────────────────────────────────
  # Inline rather than a third-party action: the logic is a few lines, so it
  # carries no external ref at all. Green only if everything it `needs` passed. If you decide to make Security
  # block merges, requiring this single check covers the whole floor.
  security-alls-green:
    name: Security all green
    if: always()
    needs:
      - gitleaks
      - osv-scanner
      - dependency-review
      # - semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # dependency-review is skipped on push (PR-only); allow that.
          ALLOWED_SKIPS: dependency-review
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          allowed = set(os.environ["ALLOWED_SKIPS"].split())
          bad = {job: r["result"] for job, r in needs.items()
                 if r["result"] != "success" and not (r["result"] == "skipped" and job in allowed)}
          for job, r in needs.items():
              print(f"{job}: {r['result']}")
          sys.exit(f"not all green: {bad}" if bad else 0)
          PY
