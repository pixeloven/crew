---
# Tag the release on merge to main. TAG-ONLY — it does NOT push to main, so it's
# compatible with branch protection (require-PR, no direct push). The version bump
# happens IN the shipping PR (ci.yml's version-bump check enforces it when skills/
# agents change), so by the time a change lands on main, plugin.json already holds
# the new version and every bump has been reviewed.
#
# Claude Code re-fetches a plugin only when plugin.json's `version` changes, so the
# in-PR bump is what actually ships to consumers tracking main; this workflow just
# creates the matching immutable tag that pinned consumers (Pi and Codex)
# reference.
name: Release (tag on version change)

on:
  push:
    branches: [main]

permissions:
  contents: write  # push the tag

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # need existing tags for the check
      - name: Tag the current plugin.json version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ver=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already tagged — the merged change didn't bump the version. Nothing to release."
            exit 0
          fi
          git tag "v$ver"
          git push origin "v$ver"
          echo "Released v$ver"
