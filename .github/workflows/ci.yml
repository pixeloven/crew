---
# This repo is a supply-chain root — its skills/agents load AS INSTRUCTIONS into
# every consumer's agents — so it lints itself on every PR. Runs on GitHub-hosted
# runners (no baked tools needed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin + skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifests, frontmatter, and description budget
        run: python3 scripts/check_skills.py

      # Layout, separately from the catalogue schema above. Frontmatter can be
      # perfect while the file sits where no harness reads it -- which is how 26
      # skills in a consumer repo stayed invisible to Claude Code for months.
      - name: Skill layout is what the harnesses read
        run: |
          python3 scripts/check_skill_layout.py --selftest
          python3 scripts/check_skill_layout.py .

      - name: Fixture-driven Doctor and Onboarding contracts
        run: python3 -m unittest discover -s tests -v

      # A link that climbs out with ../ works in a monorepo checkout and breaks
      # once the plugin is installed alone -- nothing exists above its root.
      - name: Relative Markdown links resolve inside the repo
        run: python3 scripts/check_links.py

      # version-bump below proves plugin.json moved; this proves package.json
      # (and any other harness manifest) moved with it.
      - name: Version sources agree
        run: python3 scripts/check_versions.py

  roles-rendered:
    name: agents/ + pi-agents/ rendered from roles/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rendered files match roles/ source; skill refs resolve
        run: |
          python3 scripts/render_roles.py --check
          python3 scripts/check_skill_refs.py

  generated-current:
    name: Generated catalog + index current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Templates parse
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path("templates").rglob("*.y*ml")):
              try:
                  yaml.safe_load(p.read_text())
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all templates/ YAML parses")
          PY
      - name: docs/CATALOG.md matches frontmatter
        run: python3 scripts/gen_catalog.py --check

  version-bump:
    name: Version bumped on content change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a plugin.json version bump when skills/agents change
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE" --depth=1 -q
          changed=$(git diff --name-only "origin/$BASE...HEAD" -- skills agents pi-agents roles templates || true)
          if [ -z "$changed" ]; then
            echo "No skills/agents/templates change — version bump not required."; exit 0
          fi
          base_ver=$(git show "origin/$BASE:.claude-plugin/plugin.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          head_ver=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          echo "base=$base_ver head=$head_ver"
          if [ "$base_ver" = "$head_ver" ]; then
            echo "::error::skills/agents changed but .claude-plugin/plugin.json version is still $head_ver — bump it so consumers receive the update (the release tags this version on merge)."
            exit 1
          fi
          echo "version bumped $base_ver -> $head_ver"
