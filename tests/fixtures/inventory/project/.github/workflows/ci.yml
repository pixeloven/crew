name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - name: lint
        run: |
          echo "linting"
          shellcheck scripts/*.sh
          if true; then exit 0; fi
      - run: FOO=bar gh pr checks
      - name: heredoc bodies and substitutions are not commands
        run: |
          python3 - <<'PY'
          import json
          bad = []
          PY
          base_ver=$(git show HEAD:package.json)
          tar -czf out.tgz \
            vendored-arg
      - name: builtins and functions defined in the block are not commands
        run: |
          shopt -s nullglob
          bad() { printf '::error::%s\n' "$1"; }
          function limit {
            echo "$1"
          }
          for attempt in 1 2; do
            break
          done
          bad "failed"
          limit 'capped'
          command -v jq
      - name: a PowerShell step is not read as shell
        shell: pwsh
        run: |
          try {
            Invoke-RestMethod https://example.invalid/install.ps1 | Invoke-Expression
          } catch { throw }
          "Installing the preview." | Tee-Object -FilePath $log
  windows:
    runs-on: windows-latest
    steps:
      - run: |
          Get-ChildItem $env:RUNNER_TEMP | Sort-Object LastWriteTime
      - run: >-
          bash ./scripts/probe.sh
        shell: bash
